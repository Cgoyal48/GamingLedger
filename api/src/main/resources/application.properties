spring.application.name=api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/gaming_ledger
spring.datasource.username=gaming
spring.datasource.password=gaming

# This database already has the games table from slice 1, and no Flyway history.
# Baseline marks version 1 as already applied, so V1 is not run again here.
# A brand new empty database skips the baseline and runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://mszmpfcrycyiveemmsmd.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://mszmpfcrycyiveemmsmd.supabase.co/auth/v1/.well-known/jwks.json
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=true
# Spring does not read .env on its own. This loads the repo-root file when the app runs from api/.
spring.config.import=optional:file:../.env[.properties]
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}